<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minha Loja de Ofertas</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0f0f0f;
      color:#fff;
    }

    header{
      padding:20px;
      background:#111;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    h1{
      font-size:22px;
      color:#b6ff00;
    }

    .search{
      padding:10px;
      border-radius:8px;
      border:none;
      outline:none;
      width:100%;
    }

    .categories{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .categories button{
      padding:8px 12px;
      border:none;
      border-radius:20px;
      cursor:pointer;
      background:#222;
      color:#fff;
    }

    .categories button.active{
      background:#b6ff00;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));
      gap:15px;
      padding:20px;
    }

    .card{
      background:#1a1a1a;
      border-radius:12px;
      overflow:hidden;
      padding:10px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .card img{
      width:100%;
      border-radius:10px;
    }

    .card h3{
      font-size:14px;
    }

    .price{
      color:#00ff99;
      font-weight:bold;
    }

    .btn{
      background:#b6ff00;
      color:#fff;
      padding:8px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      text-align:center;
      text-decoration:none;
      display:block;
    }

    .note{
      padding:10px 20px;
      font-size:12px;
      opacity:0.7;
    }
  </style>
</head>
<body>

<header>
  <h1>🟢 VitrineMax</h1>
  <input class="search" id="search" placeholder="Buscar produtos..." />

  <div class="categories" id="categories">
    <button class="active" data-cat="all">Todos</button>
    <button data-cat="celulares">Celulares</button>
    <button data-cat="games">Games</button>
    <button data-cat="casa">Casa</button>
  </div>
</header>

<div class="grid" id="grid"></div>

<button id="manageBtn" style="position:fixed;bottom:20px;right:20px;background:#b6ff00;color:#000;border:none;padding:12px 18px;border-radius:12px;font-weight:bold;cursor:pointer;z-index:999;">Gerenciar</button>

<div id="managePanel" style="display:none;position:fixed;top:0;right:0;width:320px;height:100%;background:#111;padding:20px;overflow:auto;z-index:1000;box-shadow:-5px 0 15px rgba(0,0,0,0.5);">
  <h2 style="margin-bottom:15px;color:#b6ff00;">Gerenciar Produtos</h2>

  <input id="title" placeholder="Nome do produto" style="width:100%;padding:10px;margin-bottom:10px;border:none;border-radius:8px;" />

  <input id="price" placeholder="Preço" style="width:100%;padding:10px;margin-bottom:10px;border:none;border-radius:8px;" />

  <input id="img" placeholder="Link da imagem" style="width:100%;padding:10px;margin-bottom:10px;border:none;border-radius:8px;" />

  <input id="link" placeholder="Link de afiliado" style="width:100%;padding:10px;margin-bottom:10px;border:none;border-radius:8px;" />

  <select id="category" style="width:100%;padding:10px;margin-bottom:10px;border:none;border-radius:8px;">
    <option value="celulares">Celulares</option>
    <option value="games">Games</option>
    <option value="casa">Casa</option>
  </select>

  <button onclick="addProduct()" style="width:100%;padding:12px;background:#b6ff00;color:#000;border:none;border-radius:10px;font-weight:bold;cursor:pointer;">
    Adicionar Produto
  </button>
</div>

<div class="note">
  *Os produtos são vendidos por lojas parceiras (Amazon, Shopee, Mercado Livre). Podemos receber comissão pelas compras realizadas através dos links.
</div>

<script>
const products = [
  {
    title: "iPhone 13",
    price: "R$ 3.999",
    category: "celulares",
    img: "https://via.placeholder.com/300",
    link: "https://seulinkdeafiliado.com"
  },
  {
    title: "PlayStation 5",
    price: "R$ 4.200",
    category: "games",
    img: "https://via.placeholder.com/300",
    link: "https://seulinkdeafiliado.com"
  },
  {
    title: "Air Fryer",
    price: "R$ 299",
    category: "casa",
    img: "https://via.placeholder.com/300",
    link: "https://seulinkdeafiliado.com"
  }
];

let currentCategory = "all";

function render(){
  const grid = document.getElementById("grid");
  const search = document.getElementById("search").value.toLowerCase();

  grid.innerHTML = "";

  products
    .filter(p => currentCategory === "all" || p.category === currentCategory)
    .filter(p => p.title.toLowerCase().includes(search))
    .forEach(p => {
      grid.innerHTML += `
        <div class="card">
          <img src="${p.img}" />
          <h3>${p.title}</h3>
          <div class="price">${p.price}</div>
          <a class="btn" href="${p.link}" target="_blank">Comprar</a>
        </div>
      `;
    });
}

document.getElementById("search").addEventListener("input", render);

document.querySelectorAll(".categories button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".categories button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentCategory = btn.dataset.cat;
    render();
  });
});

render();

const manageBtn = document.getElementById("manageBtn");
const managePanel = document.getElementById("managePanel");

manageBtn.addEventListener("click", () => {
  managePanel.style.display = managePanel.style.display === "block" ? "none" : "block";
});

function addProduct(){
  const title = document.getElementById("title").value;
  const price = document.getElementById("price").value;
  const img = document.getElementById("img").value;
  const link = document.getElementById("link").value;
  const category = document.getElementById("category").value;

  if(!title || !price || !img || !link){
    alert("Preencha todos os campos");
    return;
  }

  products.push({
    title,
    price,
    img,
    link,
    category
  });

  render();

  document.getElementById("title").value = "";
  document.getElementById("price").value = "";
  document.getElementById("img").value = "";
  document.getElementById("link").value = "";
}
</script>

</body>
</html>
